<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkMonitor — Smart Parking Detection</title>
    <meta name="description" content="AI-powered smart parking monitor with live camera feed and video analysis.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="shell">

        <!-- Top Navigation Bar -->
        <nav class="navbar">
            <div class="brand">
                <div class="brand-dot"></div>
                <span class="brand-name">ParkMonitor</span>
            </div>

            <div class="tab-group">
                <button class="tab active" id="btn-camera" onclick="switchMode('camera')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    Live Camera
                </button>
                <button class="tab" id="btn-upload" onclick="switchMode('upload')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload Video
                </button>
            </div>

            <div class="navbar-right">
                <div class="status-chip">
                    <span class="pulse-dot"></span>
                    AI Active
                </div>
                <div class="toggle-wrap">
                    <span class="toggle-label">Test Mode</span>
                    <label class="toggle">
                        <input type="checkbox" id="test-mode-toggle" checked onchange="toggleTestMode()">
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    </label>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <main class="page">

            <!-- Camera View -->
            <div id="view-camera" class="view active">
                <div class="video-card">
                    <div class="video-frame">
                        <img id="live-stream" src="/video_feed" alt="Live Camera Stream">
                        <div class="live-tag">
                            <span class="live-dot"></span>
                            LIVE
                        </div>
                    </div>
                </div>
            </div>

            <!-- Upload View -->
            <div id="view-upload" class="view hidden">
                <div class="upload-card">

                    <!-- Drop Zone -->
                    <div class="drop-zone" id="drop-zone">
                        <div class="drop-icon">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        </div>
                        <p class="drop-title">Drop your MP4 here</p>
                        <p class="drop-sub">or click the button below to browse</p>
                        <input type="file" id="file-input" accept="video/mp4" hidden>
                        <button class="btn-primary" onclick="document.getElementById('file-input').click()">Select File</button>
                    </div>

                    <!-- Processing -->
                    <div id="upload-progress" class="processing-state hidden">
                        <div class="spinner"></div>
                        <p class="processing-title">Analyzing with AI Engine…</p>
                        <p class="processing-sub">This may take a while depending on video length</p>
                        <div class="progress-track"><div class="progress-fill"></div></div>
                    </div>

                    <!-- Result -->
                    <div id="result-container" class="result-state hidden">
                        <div class="result-header">
                            <div class="check-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <span>Analysis Complete</span>
                        </div>
                        <div class="result-video-wrap">
                            <video id="result-video" controls></video>
                        </div>
                        <div class="result-actions">
                            <a id="download-btn" href="#" class="btn-primary" download>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                Download
                            </a>
                            <button class="btn-ghost" onclick="resetUpload()">Analyze Another</button>
                        </div>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <script src="/static/main.js?v=3"></script>
</body>
</html>
